site_name: 5CTA0 · Pass the exam
site_description: Every 5CTA0 Statistical Signal Processing exam question (2019–2026), solved step by step, organised by the patterns that keep coming back.
site_url: https://dkealvaro.github.io/5cta0-exam-guide/
use_directory_urls: false
repo_url: https://github.com/DKeAlvaro/5cta0-exam-guide
repo_name: 5cta0-exam-guide

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    logo: material/sine-wave
    repo: fontawesome/brands/github
  features:
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - content.tooltips

plugins: []

nav:
  - Start here: index.md
  - "New · Exam course":
      - Block 1 · Probability (1.5 p):
          - 1.1 Bayes word problems: e1-bayes.md
          - 1.2 Joint PDFs: e1-joint.md
          - 1.3 Stationary and ergodic: e1-wss.md
          - 1.4 Spectral factorisation: e1-factor.md
      - Block 2 · Estimation (3–3.5 p):
          - 2.1 Maximum likelihood: e2-mle.md
          - 2.2 MAP with a prior: e2-map.md
          - 2.3 Least-squares line: e2-ls.md
          - 2.4 Theory questions: e2-facts.md
      - Block 3 · Spectral estimation (3 p):
          - 3.1 Correlogram, pick the plot: e3-corr.md
          - 3.2 AR and MA models: e3-arma.md
          - 3.3 Periodogram, Welch, theory: e3-facts.md
      - Block 4 · Detection (2–2.5 p):
          - 4.1 Likelihood ratio test: e4-lrt.md
          - 4.2 Priors, costs, theory: e4-bayes.md
      - Mock exams with answers: exams.md
      - A4 cheat sheet: cheatsheet.md
  - "Old · Long guide (deep dive)":
      - The exam, decoded: patterns.md
      - Chapter 0 · From zero: p0-foundations.md
      - Toolbox: toolbox.md
      - 1.1 Bayes & total probability: p1-bayes.md
      - 1.2 Random variables & joint PDFs: p1-rv.md
      - 1.3 Random processes: p1-processes.md
      - 1.4 Spectral factorisation: p1-factorisation.md
      - 2.1 Maximum likelihood: p2-mle.md
      - 2.2 CRLB & Fisher information: p2-crlb.md
      - 2.3 Bayesian estimation: p2-bayes.md
      - 2.4 Least squares: p2-ls.md
      - 3.1 Signals, windows, zero padding: p3-windows.md
      - 3.2 Non-parametric estimators: p3-nonparametric.md
      - 3.3 Autocorrelation of ARMA models: p3-autocorr.md
      - 3.4 Correlogram → AR → MA: p3-chain.md
      - 4.1 Errors, ROC, Neyman–Pearson: p4-basics.md
      - 4.2 Likelihood ratio tests: p4-lrt.md
      - 4.3 Bayesian detection: p4-bayes.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - toc:
      permalink: "#"
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.11/dist/katex.min.js
  - https://unpkg.com/katex@0.16.11/dist/contrib/auto-render.min.js
  - javascripts/quiz.js
  - javascripts/ask.js
  - javascripts/video.js
  - javascripts/layout.js
  - javascripts/keypoints.js

  - javascripts/progress.js
  - javascripts/widgets.js
  - javascripts/navsections.js
extra_css:
  - https://unpkg.com/katex@0.16.11/dist/katex.min.css
  - https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap
  - stylesheets/extra.css
  - stylesheets/ask.css
  - stylesheets/layout.css
  - stylesheets/keypoints.css
  - stylesheets/widgets.css

extra:
  generator: false

hooks:
  - hooks/cachebust.py
